<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset='utf-8'>
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
    <link rel="manifest" href="/site.webmanifest">
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#5bbad5">
    <meta name="msapplication-TileColor" content="#da532c">
    <meta name="theme-color" content="#151515">

    {% include head-custom.html %}

{% seo %}
  </head>

  <body>

    <header class="masthead">
      <button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">&#9776;</button>
      <a id="a-title" href="{{ '/' | relative_url }}">
        <span class="title">{{ site.title | default: site.github.repository_name }}</span>
      </a>
      <span class="subtitle">{{ site.description | default: site.github.project_tagline }}</span>
    </header>

    <div class="wrap">
      <aside class="sidebar" id="sidebar">
        {% include navigation.html %}
      </aside>

      <main class="main">
        <section id="main_content" class="content">
          {{ content }}
        </section>
      </main>

      <nav class="toc" id="toc" aria-label="On this page">
        <p class="toc-title">On this page</p>
        <ul id="toc-list"></ul>
      </nav>
    </div>

    <div class="sidebar-scrim" id="sidebar-scrim"></div>

    {% include cookie-consent.html %}
    <script src="{{ '/assets/js/docs.js' | relative_url }}"></script>
  </body>
</html>
