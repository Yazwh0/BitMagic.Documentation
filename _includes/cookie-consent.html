<style>
    #cookie-notice {
        display: none;
        position: fixed;
        z-index: 60;
        right: 1rem;
        bottom: 1rem;
        max-width: 22rem;
        padding: 0.9rem 1rem 1rem;
        background: var(--bg-alt, #101010);
        border: 1px solid var(--border, #2b2b2b);
        border-left: 3px solid var(--accent, #b5e853);
        border-radius: 4px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
        color: var(--fg, #eaeaea);
        font-family: var(--mono, Consolas, monospace);
        font-size: 0.8rem;
        line-height: 1.55;
    }

    #cookie-notice p {
        margin: 0 0 0.75rem;
        color: var(--muted, #8f8f8f);
    }

    #cookie-notice .cookie-actions {
        display: flex;
        gap: 0.5rem;
        align-items: center;
    }

    #cookie-notice a {
        cursor: pointer;
        text-decoration: none;
        font-size: 0.78rem;
    }

    #cookie-notice-accept {
        padding: 0.35rem 0.9rem;
        background: var(--accent, #b5e853);
        color: #151515;
        border-radius: 3px;
        font-weight: 700;
    }

    #cookie-notice-accept:hover {
        filter: brightness(1.1);
    }

    #cookie-notice .cookie-more {
        padding: 0.35rem 0.5rem;
        color: var(--link, #63c0f5);
    }

    #cookie-notice .cookie-more:hover {
        text-decoration: underline;
    }

    @media (max-width: 40rem) {
        #cookie-notice {
            right: 0.75rem;
            left: 0.75rem;
            bottom: 0.75rem;
            max-width: none;
        }
    }
</style>
<div id="cookie-notice">
    <p>This site uses Google Analytics, which sets cookies. Nothing loads until you approve.</p>
    <div class="cookie-actions">
        <a id="cookie-notice-accept">Approve</a>
        <a href="/privacy" class="cookie-more">More info</a>
    </div>
</div>
<script>
    function createCookie(name, value, days) {
        var expires = "";
        if (days) {
            var date = new Date();
            date.setTime(date.getTime() + (days * 24 * 60 * 60 * 1000));
            expires = "; expires=" + date.toUTCString();
        }
        document.cookie = name + "=" + value + expires + "; path=/";
    }
    function readCookie(name) {
        var nameEQ = name + "=";
        var ca = document.cookie.split(';');
        for (var i = 0; i < ca.length; i++) {
            var c = ca[i];
            while (c.charAt(0) == ' ') c = c.substring(1, c.length);
            if (c.indexOf(nameEQ) == 0) return c.substring(nameEQ.length, c.length);
        }
        return null;
    }
    function eraseCookie(name) {
        createCookie(name, "", -1);
    }

    function enableAnalytics() {
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());
        gtag('config', 'G-4VXHQP7F7C');
    }

    if (readCookie('cookie-notice-dismissed') == 'true') {
        enableAnalytics();
    } else {
        document.getElementById('cookie-notice').style.display = 'block';
    }
    document.getElementById('cookie-notice-accept').addEventListener("click", function () {
        createCookie('cookie-notice-dismissed', 'true', 31);
        document.getElementById('cookie-notice').style.display = 'none';
        enableAnalytics();
    });
</script>
